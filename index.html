<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohamed Mahmoud — Flagship</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;height:100%;background:#06060c;color:#aab0d6;
    font:500 14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
  .dots{display:grid;grid-template-columns:repeat(3,8px);gap:5px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#7a86e8;opacity:.85;
    animation:mmp 1.1s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.1s;background:#2997ff}
  .dots i:nth-child(3){animation-delay:.2s;background:#bf5af2}
  .dots i:nth-child(4){animation-delay:.15s;background:#ff9f0a}
  .dots i:nth-child(5){animation-delay:.25s;background:#ff453a}
  .dots i:nth-child(6){animation-delay:.35s;background:#30d158}
  .dots i:nth-child(7){animation-delay:.3s;background:#5ac8fa}
  .dots i:nth-child(8){animation-delay:.4s;background:#bf5af2}
  .dots i:nth-child(9){animation-delay:.5s;background:#ffd60a}
  @keyframes mmp{0%,100%{transform:scale(.7);opacity:.4}50%{transform:scale(1);opacity:1}}
  .fallback{max-width:20rem;font-size:13px;color:#6f74a0}
  .fallback a{display:inline-block;margin:6px 10px;padding:8px 14px;border:1px solid #23233a;
    border-radius:100px;text-decoration:none;color:#c9cdf0}
</style>
</head>
<body>
  <div class="wrap">
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <p>Opening the right experience for your device…</p>
    <noscript>
      <p class="fallback">Choose a version:
        <a href="mobile.html">Phone</a>
        <a href="desktop.html">Desktop</a>
      </p>
    </noscript>
  </div>
<script>
(function () {
  // Auto-detect phone vs. desktop and forward. No stored preference — detects
  // every visit. Manual override for testing: ?view=mobile or ?view=desktop.
  function isPhone() {
    try {
      var q = (location.search || '').toLowerCase();
      if (/[?&](view|force)=mobile\b/.test(q)) return true;
      if (/[?&](view|force)=desktop\b/.test(q)) return false;

      var ua = navigator.userAgent || navigator.vendor || '';
      var phoneUA  = /iPhone|iPod|Android.*Mobile|Windows Phone|IEMobile|BlackBerry|Opera Mini|Mobile.*Firefox/i.test(ua);
      var tabletUA = /iPad|Tablet|PlayBook|Silk|Android(?!.*Mobile)/i.test(ua);

      var mm = window.matchMedia || function () { return { matches: false }; };
      var coarse  = mm('(pointer:coarse)').matches;
      var noHover = mm('(hover:none)').matches;
      var touch   = ('ontouchstart' in window) || (navigator.maxTouchPoints | 0) > 0;
      var minSide = Math.min(screen.width || 9999, screen.height || 9999);

      if (phoneUA) return true;          // explicit phone UA
      if (tabletUA) return false;        // tablets -> desktop experience
      // iPadOS masquerades as macOS; a large coarse touch screen is a tablet -> desktop.
      // Only true phones (short side <= 540px) with coarse, hover-less, touch input go mobile.
      return coarse && noHover && touch && minSide <= 540;
    } catch (e) { return false; }
  }

  var target = isPhone() ? 'mobile.html' : 'desktop.html';
  // Preserve any hash (e.g. deep link to a chapter); drop the router's own query.
  location.replace(target + (location.hash || ''));
})();
</script>
</body>
</html>
